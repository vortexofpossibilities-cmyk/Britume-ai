
name: Deploy BRITUME Supabase Function

on:
  push:
    branches:
      - main
    paths:
      - "supabase/functions/bright-action/**"
      - ".github/workflows/deploy-supabase.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Prepare Supabase configuration
        run: |
          mkdir -p supabase
          cat > supabase/config.toml <<'EOF'
          project_id = "sckolejvbpqbzrjszyyl"

          [functions.bright-action]
          verify_jwt = true
          EOF

      - name: Deploy BRITUME Edge Function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase functions deploy bright-action \
            --project-ref sckolejvbpqbzrjszyyl
