
name: Deploy BRITUME AI to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: |
          npm install
          npx expo install react-native-web react-dom expo-asset expo-font
          npm install query-string @opentelemetry/api

      - name: Check Expo configuration
        run: npx expo config --type public

      - name: Build Expo web app
        run: npx expo export --platform web

      - name: Verify website output
        run: |
          if [ ! -f dist/index.html ]; then
            echo "ERROR: dist/index.html was not generated."
            echo "Contents of dist:"
            find dist -maxdepth 3 -type f || true
            exit 1
          fi

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
